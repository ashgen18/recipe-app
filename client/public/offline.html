<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f4d3a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Offline · Recipes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f4ef;
        --fg: #163226;
        --muted: #5a6b62;
        --card: #fffdf9;
        --accent: #1f4d3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121a16;
          --fg: #f0ebe3;
          --muted: #a8b5ae;
          --card: #1a2420;
          --accent: #4d9a72;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Source Sans 3", system-ui, sans-serif;
        background:
          radial-gradient(ellipse 70% 50% at 20% 0%, rgba(31, 77, 58, 0.18), transparent),
          var(--bg);
        color: var(--fg);
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        background: var(--card);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-family: Georgia, "Fraunces", serif;
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        margin-right: 0.5rem;
        padding: 0.65rem 1rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <main role="main">
      <h1>You’re offline</h1>
      <p>
        This page isn’t cached yet. Open Favorites for recipes saved on this
        device, or reconnect to browse TheMealDB.
      </p>
      <a href="/favorites">Open favorites</a>
      <a class="secondary" href="/">Try home</a>
    </main>
  </body>
</html>
