<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Recipes">
  <defs>
    <linearGradient id="bowl" x1="96" y1="180" x2="416" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f4ef"/>
      <stop offset="100%" stop-color="#e8dfd0"/>
    </linearGradient>
    <linearGradient id="soup" x1="160" y1="220" x2="352" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c45c26"/>
      <stop offset="100%" stop-color="#a84a1c"/>
    </linearGradient>
    <linearGradient id="spoon" x1="280" y1="96" x2="360" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0ebe3"/>
      <stop offset="100%" stop-color="#d4cbb8"/>
    </linearGradient>
  </defs>

  <!-- App primary rounded tile -->
  <rect width="512" height="512" rx="112" fill="#1f4d3a"/>

  <!-- Soft inner glow matching cream background -->
  <circle cx="256" cy="268" r="168" fill="#2a5c46"/>

  <!-- Bowl body -->
  <path
    d="M118 250c8 118 70 178 138 178s130-60 138-178H118z"
    fill="url(#bowl)"
  />
  <!-- Bowl rim -->
  <ellipse cx="256" cy="250" rx="148" ry="42" fill="#fffdf8"/>
  <ellipse cx="256" cy="250" rx="128" ry="34" fill="url(#soup)"/>
  <!-- Soup highlight -->
  <ellipse cx="220" cy="242" rx="46" ry="12" fill="#e07a3d" opacity="0.55"/>

  <!-- Spoon (bowl of spoon resting in soup, handle up-right like 🥣) -->
  <g transform="rotate(-28 300 210)">
    <ellipse cx="268" cy="232" rx="34" ry="26" fill="url(#spoon)"/>
    <ellipse cx="260" cy="226" rx="14" ry="10" fill="#ffffff" opacity="0.35"/>
    <rect x="292" y="120" width="22" height="118" rx="11" fill="url(#spoon)"/>
    <rect x="296" y="124" width="8" height="70" rx="4" fill="#ffffff" opacity="0.28"/>
  </g>
</svg>
